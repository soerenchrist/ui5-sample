_schema-version: 3.3.0
ID: toom_sample
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: toom_sample-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: toom_sample-db
      - name: toom_sample-auth

  - name: toom_sample-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: toom_sample-db

  - name: toom_sample-frontend
    type: html5
    path: ./app/toom
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []

  - name: toom_sample-frontend-deployer
    # type: com.sap.html5.application-content for plain contents without zip
    type: com.sap.application.content
    path: ./app/toom
    requires:
      - name: toom-html-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: toom_sample-frontend
          artifacts:
            - toom-frontend.zip
          target-path: resources/

resources:
  - name: toom_sample-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: toom-html-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: toom-html-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: toom_sample-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: toom_sample-${org}-${space}
        tenant-mode: dedicated
